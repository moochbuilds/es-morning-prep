name: Refresh data and deploy

on:
  push:
    branches: [main]
  # Started by the previous run (the `next` job below) and by the page's
  # Refresh button.
  workflow_dispatch:
    inputs:
      deploy:
        description: Also redeploy the Pages site (pushes to main always do)
        type: boolean
        default: false
  # Only a restart for the chain. GitHub's scheduler is best effort and drops
  # most of these under load (down to ~6 runs a day in Sep 2026).
  schedule:
    # Cron is UTC. US index futures trade Sun 6pm ET to Fri 5pm ET.
    # Minutes are offset from :00 because GitHub's scheduler is most congested
    # at the top of the hour, which is when runs get delayed or dropped.
    #
    # Every 15 minutes while futures trade, to restart the chain if it breaks
    # (UTC Monday 00:00 is Sunday 8pm ET; Friday 22:00 UTC is 5pm EST).
    - cron: "7-59/15 22-23 * * 0"
    - cron: "7-59/15 * * * 1-4"
    - cron: "7-59/15 0-21 * * 5"
    # Hourly while futures are closed, so the next-session view stays fresh.
    - cron: "17 22-23 * * 5"
    - cron: "17 * * * 6"
    - cron: "17 0-21 * * 0"

permissions:
  actions: write # the next run in the chain
  contents: write # data branch, keepalive heartbeat commit
  pages: write
  id-token: write

# One deploy at a time. A tick that arrives mid-run waits rather than racing.
# GitHub keeps at most one pending run per group and cancels the older one, so
# duplicate chains (a cron tick, a push, a Refresh click) collapse into one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      started: ${{ steps.start.outputs.at }}
    steps:
      - id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The engine decides every classification on the page; a regression must
      # never publish.
      - name: Test engine
        run: npm test

      - name: Fetch market data
        run: npm run data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Last known good values for any provider that fails this run.
          PREVIOUS_SNAPSHOT_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/dashboard.json

      # The page reads snapshots from the `data` branch rather than the Pages
      # site: Pages throttles a site redeployed every couple of minutes, still
      # reporting each deploy as a success but serving an hours-old build. The
      # branch is one force-pushed commit, so it never accumulates history.
      - name: Publish data snapshot
        working-directory: public/data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]"               -c user.email="41898282+github-actions[bot]@users.noreply.github.com"               commit -q -m "Data snapshot $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data

      - id: pages
        if: github.event_name == 'push' || inputs.deploy
        uses: actions/configure-pages@v5

      - name: Build static site
        if: steps.pages.outcome == 'success'
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Lets the page's Refresh button start this workflow.
          NEXT_PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: out

  deploy:
    needs: build
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Each run starts the next one: GitHub's cron can't be relied on for the
  # cadence. Events started with GITHUB_TOKEN don't trigger workflows, except
  # workflow_dispatch, which is what this uses. The dispatched run waits in the
  # concurrency group until this one finishes. Cancel a run to stop the chain;
  # the next landed cron tick restarts it.
  next:
    needs: [build, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Queue the next refresh while futures trade
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ needs.build.outputs.started }}
          FAILED: ${{ needs.build.result != 'success' || needs.deploy.result == 'failure' }}
          TZ: America/New_York
        run: |
          # Futures trade Sun 6pm to Fri 5pm ET. While they're closed the
          # hourly crons refresh the page instead.
          dow=$(date +%u) hm=$(date +%-H%M)
          if [ "$dow" -eq 6 ] || { [ "$dow" -eq 7 ] && [ "$hm" -lt 1800 ]; } \
             || { [ "$dow" -eq 5 ] && [ "$hm" -ge 1700 ]; }; then
            echo "Futures closed; not chaining."
            exit 0
          fi

          # Every 2 minutes through the trading day (weekdays 7am-5pm ET),
          # every 10 overnight: inside the 15-minute DELAYED threshold. Back
          # off after a failure so a broken provider isn't retried nonstop.
          spacing=600
          if [ "$dow" -le 5 ] && [ "$hm" -ge 700 ] && [ "$hm" -lt 1700 ]; then spacing=120; fi
          if [ "$FAILED" = "true" ] && [ "$spacing" -lt 600 ]; then spacing=600; fi

          # This job holds the concurrency group while it waits, so a Refresh
          # click would queue behind it. Step aside for any queued run: it
          # continues the chain itself.
          end=$(( ${STARTED:-0} + spacing ))
          while [ "$(date +%s)" -lt "$end" ]; do
            waiting=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?per_page=5" \
              --jq '[.workflow_runs[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length' \
              || echo 0)
            if [ "$waiting" -gt 0 ]; then
              echo "A newer run is queued; it continues the chain."
              exit 0
            fi
            sleep 30
          done

          for attempt in 1 2 3; do
            gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY" && exit 0
            sleep $(( attempt * 15 ))
          done
          exit 1

  # GitHub disables scheduled workflows in public repos after 60 days without
  # commits. Pages deploys are artifacts, not commits, so without this the
  # refresh would silently stop about two months after the last code change.
  keepalive:
    if: github.event.schedule == '17 * * * 6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a heartbeat if the repo has been quiet for 45 days
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was ${age_days} days ago."
          if [ "$age_days" -ge 45 ]; then
            date -u +%FT%TZ > .github/heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat
            git commit -m "chore: keep scheduled refresh alive"
            git push
          fi
