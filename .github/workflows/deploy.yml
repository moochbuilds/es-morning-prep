name: Refresh data and deploy

on:
  push:
    branches: [main]
  # Started by the previous run (the `next` job below) and by the page's
  # Refresh button.
  workflow_dispatch:
  # Only a restart for the chain. GitHub's scheduler is best effort and drops
  # most of these under load (down to ~6 runs a day in Sep 2026).
  schedule:
    # Cron is UTC. US index futures trade Sun 6pm ET to Fri 5pm ET.
    # Minutes are offset from :00 because GitHub's scheduler is most congested
    # at the top of the hour, which is when runs get delayed or dropped.
    #
    # Every 5 minutes on weekdays (UTC Monday 00:00 is Sunday 8pm ET).
    - cron: "2-59/5 * * * 1-5"
    # Sunday evening from the futures open (22:00 UTC is 6pm EDT; 23:00 is 6pm EST).
    - cron: "2-59/5 22-23 * * 0"
    # Twice an hour the rest of the weekend, so the next-session view stays fresh.
    - cron: "17,47 0-21 * * 0"
    - cron: "17,47 * * * 6"

permissions:
  actions: write # the next run in the chain
  contents: write # keepalive heartbeat commit
  pages: write
  id-token: write

# One deploy at a time. A tick that arrives mid-run waits rather than racing.
# GitHub keeps at most one pending run per group and cancels the older one, so
# duplicate chains (a cron tick, a push, a Refresh click) collapse into one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      started: ${{ steps.start.outputs.at }}
    steps:
      - id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The engine decides every classification on the page; a regression must
      # never publish.
      - name: Test engine
        run: npm test

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch market data
        run: npm run data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Last known good values for any provider that fails this run.
          PREVIOUS_SNAPSHOT_URL: ${{ steps.pages.outputs.base_url }}/data/dashboard.json

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Lets the page's Refresh button start this workflow.
          NEXT_PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Each run starts the next one: GitHub's cron can't be relied on for the
  # cadence. Events started with GITHUB_TOKEN don't trigger workflows, except
  # workflow_dispatch, which is what this uses. The dispatched run waits in the
  # concurrency group until this one finishes. Cancel a run to stop the chain;
  # the next landed cron tick restarts it.
  next:
    needs: [build, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Queue the next refresh while futures trade
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ needs.build.outputs.started }}
          FAILED: ${{ needs.build.result != 'success' || needs.deploy.result != 'success' }}
        run: |
          # Sunday 22:00 UTC (6pm EDT) to Friday 22:00 UTC (5pm EST). The
          # weekend crons cover the rest.
          dow=$(date -u +%u) hour=$(date -u +%-H)
          if [ "$dow" -eq 6 ] || { [ "$dow" -eq 7 ] && [ "$hour" -lt 22 ]; } \
             || { [ "$dow" -eq 5 ] && [ "$hour" -ge 22 ]; }; then
            echo "Futures closed; not chaining."
            exit 0
          fi

          # About one refresh every 2 minutes; back off after a failure so a
          # broken provider doesn't turn into a run every minute.
          spacing=120
          if [ "$FAILED" = "true" ]; then spacing=600; fi
          delay=$(( ${STARTED:-0} + spacing - $(date +%s) ))
          if [ "$delay" -gt "$spacing" ]; then delay=$spacing; fi
          if [ "$delay" -gt 0 ]; then sleep "$delay"; fi

          for attempt in 1 2 3; do
            gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY" && exit 0
            sleep $(( attempt * 15 ))
          done
          exit 1

  # GitHub disables scheduled workflows in public repos after 60 days without
  # commits. Pages deploys are artifacts, not commits, so without this the
  # refresh would silently stop about two months after the last code change.
  keepalive:
    if: github.event.schedule == '17,47 * * * 6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a heartbeat if the repo has been quiet for 45 days
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was ${age_days} days ago."
          if [ "$age_days" -ge 45 ]; then
            date -u +%FT%TZ > .github/heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat
            git commit -m "chore: keep scheduled refresh alive"
            git push
          fi
